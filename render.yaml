# Render blueprint for the Express + Socket.IO backend.
#
# The frontend is NOT deployed here — it's a static Expo web export hosted
# on Vercel (see vercel.json). Only the API needs a long-running Node
# process, because Socket.IO holds persistent WebSocket connections that a
# serverless function can't keep open.
#
# Build and start run from the repo root, not apps/api: npm workspaces
# hoists dependencies and symlinks @swasthya-setu/shared-types into the
# root node_modules, so installing from a subdirectory would not resolve it.
services:
  - type: web
    name: swasthya-setu-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:api
    startCommand: npm run start --workspace apps/api
    healthCheckPath: /api/health
    envVars:
      # Set these in the Render dashboard — never commit real values.
      # sync: false means "prompt me, don't read it from this file".
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Not a secret — the two deployed frontend origins, so the API only
      # answers CORS/Socket.IO requests from them instead of any website.
      # A committed `value` (unlike the sync: false ones above) is applied
      # automatically on the next blueprint sync, no dashboard step needed.
      - key: CORS_ORIGINS
        # http://localhost:8081 added temporarily to test teleconsultation
        # against a local Expo web build before the mobile app is actually
        # deployed to Vercel — remove once that deployment exists and this
        # kind of testing moves to the real staging URL instead.
        value: https://swasthyasetu.vercel.app,https://swasthyasetu-admin.vercel.app,http://localhost:8081
